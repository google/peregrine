// This file only contains RPC-related message definitions.

edition = "2024";

package peregrine.internal.proto;

import "src/internal/control/message_internal.proto";

// static_assert(assumptions::kThereIsOnlyOnePairOfWrapperControlMessages);
message ReqMsg {
  oneof msg {
    HostInfo host_info = 1;
    PeerRequests peer_requests = 2;
    RdmaConnectRequest rdma_connect_req = 3;
    PspKeyRequest psp_key_req = 4;
    // Append new request types here.
  }
}

message RespMsg {
  oneof msg {
    HostInfo host_info = 1;
    PeerResponse peer_response = 2;
    RdmaConnectResponse rdma_connect_resp = 3;
    PspKeyResponse psp_key_resp = 4;
    // Append new request types here.
  }
}

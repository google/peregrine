syntax = "proto3";

package peregrine.benchmark.proto;

message TransferRequest {
  // Trigger for the receiver to return its buffer address.
}

message TransferResponse {
  uint64 buffer_address = 1;
}

message ControlMessage {
  oneof payload {
    TransferRequest transfer_request = 1;
    TransferResponse transfer_response = 2;
  }
}
